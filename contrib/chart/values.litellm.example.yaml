# Example overlay: in-cluster LiteLLM as the Codex LLM gateway.
#
# Sandboxes reach LiteLLM directly (NO_PROXY + NetworkPolicy egress). iron-proxy
# cannot forward plain HTTP to :4000 (CONNECT-only for HTTPS); api-rs injects the
# real LITELLM_MASTER_KEY into sandbox VLLM_API_KEY at pod create time.
#
# Layer on top of values.local-slack.example.yaml:
#   export CENTAUR_EXTRA_VALUES=contrib/chart/values.local-slack.example.yaml,contrib/chart/values.litellm.example.yaml
#   just up
#
# Prerequisites:
#   export LITELLM_MASTER_KEY="$(openssl rand -hex 32)"
#   export GEMINI_API_KEY=...        # Google AI Studio key (https://aistudio.google.com/apikey)
#   # optional: export OPENAI_API_KEY=sk-...   # only if using OpenAI models in config
#   just bootstrap-secrets
#
# Do NOT put OPENAI_API_KEY in centaur-infra-env via sync-local-env.sh on this
# path; bootstrap writes provider keys to centaur-litellm-env only.

litellm:
  enabled: true

apiRs:
  # Warm sandboxes reserve ~4GB each; keep at 0 on a laptop, 0–1 on Mac Studio.
  sandboxWarmPoolSize: 0

sandbox:
  extraEnv:
    CODEX_USE_VLLM: "1"
    CODEX_MODEL_PROVIDER: "vllm"
    VLLM_BASE_URL: http://centaur-centaur-litellm:4000/v1
    VLLM_API_KEY: LITELLM_API_KEY
    CODEX_MODEL: gemini/gemini-2.5-flash
