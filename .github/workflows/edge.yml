name: Edge

on:
  pull_request:
    branches: [main, edge/cloudflare]
    paths:
      - 'contrib/edge/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/edge.yml'
  push:
    branches: [edge/cloudflare]
    paths:
      - 'contrib/edge/**'

concurrency:
  group: edge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    name: centaur-edge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/edge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@41ff72655975bd7131e965daab8c472042a79463 # v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933aa825ca864de1dd049e088caaae0823caed # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm check:types

      - name: Test
        run: pnpm test

      - name: Wrangler dry-run
        run: pnpm deploy:dry-run
