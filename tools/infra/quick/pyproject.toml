[project]
name = "quick"
description = "Quick — zero-friction static-site (HTML/JS/CSS) deployment for agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quick = "quick.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.centaur]
module = "client.py"
# The default 'local' backend needs no secrets. To enable the 's3' backend
# (AWS S3 or Cloudflare R2), the deployment supplies an `aws_auth` secret so
# iron-proxy injects SigV4 for the bucket host — the tool never sees raw keys.
# See references/architecture.md for the exact entry to add for your bucket, e.g.
#   optional_secrets = [
#     {type = "aws_auth", name = "QUICK_S3", hosts = ["<bucket>.<endpoint>"],
#      access_key_id = "QUICK_S3_ACCESS_KEY_ID",
#      secret_access_key = "QUICK_S3_SECRET_ACCESS_KEY",
#      allowed_services = ["s3"]},
#   ]
secrets = []
